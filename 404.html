<style>
:root{--bg:#fdfcf9;--line:#e7e2d4;--text:#212b3d;--muted:#5b6472;--navy:#1d3461;--gold-soft:#d9b36a;--gold-ink:#171104;
--serif:"Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", "Noto Serif CJK JP", serif;--sans:"Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", "Noto Sans CJK JP", "BIZ UDPGothic", Meiryo, sans-serif;--num:"Oswald","Noto Sans JP",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;line-height:1.9}
header{border-bottom:1px solid var(--line)}
.nav{max-width:1240px;margin:0 auto;padding:0 22px;height:62px;display:flex;align-items:center}
.logo{font-family:var(--num);font-weight:600;letter-spacing:.26em;font-size:14px;text-decoration:none;color:var(--navy)}
.logo b{color:var(--gold-soft)}
.logo img{height:38px;width:auto;display:block}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 22px;text-align:center}
.code{font-family:var(--num);font-weight:600;font-size:96px;color:var(--gold-soft);line-height:1}
h1{font-family:var(--serif);font-weight:800;font-size:clamp(20px,4vw,26px);color:var(--navy);margin:14px 0 10px}
p{color:var(--muted);font-size:14.5px;max-width:460px;margin:0 auto 28px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 26px;border-radius:999px;font-weight:700;font-size:14px;text-decoration:none;font-family:var(--sans)}
.btn-primary{background:linear-gradient(135deg,#ffb25e,#f97316 58%,#e8630a);color:var(--gold-ink)}
.btn-ghost{border:1.5px solid var(--navy);color:var(--navy)}
footer{border-top:1px solid var(--line);padding:26px 22px;font-size:12px;color:#5b6472;text-align:center}
</style>
<!-- GA4 -->

    <p>URLが変更されたか、削除された可能性があります。トップページ、またはブログ・無料診断からお探しください。</p>
    <div class="row">
      <a class="btn btn-primary" href="/">トップページへ戻る</a>
      <a class="btn btn-ghost" href="/blog/">ブログを見る</a>
