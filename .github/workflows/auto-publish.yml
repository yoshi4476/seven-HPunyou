# =============================================================
# 毎日ブログ自動更新ワークフロー (セブンセンシズ株式会社)
# - JST 朝7時  (UTC 22:00): 本流記事2本 (キーワードキューから優先度順)
# - JST 夕17時 (UTC 08:00): ニュース型記事1本
# - workflow_dispatch で手動実行も可能 (mode: main / news)
#
# 必要な設定 (認証は CLAUDE_CODE_OAUTH_TOKEN > ANTHROPIC_API_KEY の優先順。どちらか一方でよい):
#   Secrets: CLAUDE_CODE_OAUTH_TOKEN (推奨: Claude Pro/Max サブスク認証。`claude setup-token` で生成)
#            または ANTHROPIC_API_KEY (従量課金),
#            SLACK_WEBHOOK, (任意) INDEXNOW_KEY, (任意) UNSPLASH_ACCESS_KEY,
#            (推奨) CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID (本番自動デプロイ用)
#   Variables: CLAUDE_MODEL (APIキー認証時は必須。サブスク認証時は任意 = CLI既定モデル),
#              (任意) SITE_URL
# =============================================================
name: 毎日ブログ自動更新

on:
  schedule:
    - cron: '0 22 * * *' # JST 朝7時 → 本流2本
    - cron: '0 8 * * *'  # JST 夕17時 → ニュース1本
    - cron: '30 22 * * 0' # JST 日曜朝7時半 → 既存記事1本を最新化リライト (コンテンツ・ディケイ対策)
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード (main=本流2本 / news=ニュース1本)'
        required: false
        default: 'main'
        type: choice
        options:
          - main
          - news

permissions:
  contents: write # 生成した記事・キュー更新をリポジトリへコミットするため

concurrency:
  group: auto-publish
  cancel-in-progress: false # 実行中のパイプラインを中断しない (生成途中の記事破損防止)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: blog-system # スクリプト・package.json は blog-system/ 配下にある
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # 従量課金モード用 (CLAUDE_CODE_OAUTH_TOKEN があればそちらを優先。両対応)
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }} # モデルIDはハードコード禁止。Variables で管理する (サブスク認証時は未設定可 = CLI既定モデル)
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }} # (任意) 画像フォールバック②の写真API。未設定なら③ローカル素材へ
      SITE_URL: ${{ vars.SITE_URL }} # 未設定時はスクリプト側のデフォルト (仮ドメイン) を使用
      MIN_SCORE: '85'      # 品質ループの合格ライン (辛口採点AIの実測上限82点を踏まえ90→85に較正。2026-07-23)
      MAX_REVISIONS: '5'   # 品質ループの最大改稿回数

    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Node.js 20 セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: blog-system/package-lock.json

      - name: 依存関係インストール
        run: npm ci

      # サブスク認証 (CLAUDE_CODE_OAUTH_TOKEN) が設定されている場合のみ Claude Code CLI を導入する。
      # ※ secrets はステップの if 式で直接比較できないため、env に渡してシェル内で判定する
      - name: Claude Code CLI セットアップ (サブスク認証時のみ)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN を検出 → Claude Code CLI をインストールします (サブスク認証モード)"
            npm install -g @anthropic-ai/claude-code
            claude --version
          else
            echo "CLAUDE_CODE_OAUTH_TOKEN 未設定 → CLI インストールをスキップ (ANTHROPIC_API_KEY の従量課金モードで動作)"
          fi

      # キーワード残量が15本を切ったらClaudeが新キーワードを自動補充 (枯渇による空振り防止)
      - name: キーワード自動補充
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/replenish-keywords.mjs

      # SVG図解の日本語が豆腐化しないよう、画像化(librsvg/sharp)の前に日本語フォントを導入
      - name: 日本語フォント導入 (図解の文字化け防止)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null && fc-cache -f >/dev/null

      # 夕方スケジュール or 手動 news 指定時は --news でニュース1本モード
      # 日曜朝はリライトモード (新規生成せず、最古の公開記事を最新化して再審査へ)
      # 認証はサブスク (CLAUDE_CODE_OAUTH_TOKEN) > APIキー (ANTHROPIC_API_KEY) の優先順
      - name: 記事生成 (Claude)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ "${{ github.event.schedule }}" = "30 22 * * 0" ]; then
            node scripts/refresh-article.mjs
          elif [ "${{ github.event.schedule }}" = "0 8 * * *" ] || [ "${{ inputs.mode }}" = "news" ]; then
            node scripts/generate-articles.mjs --news
          else
            node scripts/generate-articles.mjs
          fi

      # 執筆AIとは別セッション(別呼び出し)で採点→90点未満は差し戻し改稿(最大5回)
      - name: 品質ループ (採点・改稿)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/quality-loop.mjs

      # サムネ生成(SVG→PNG/WebP) + 本文画像の3段フォールバック
      # (①AI生成SVG図解 → ②Unsplash写真 → ③ローカル素材)・alt付与・150KB圧縮
      - name: 画像生成・埋め込み (Sharp + 3段フォールバック)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/embed-images.mjs

      # 執筆AIから独立した機械チェック。不合格は human-review/ へ隔離
      - name: 安全ゲート (機械チェック)
        run: node scripts/safety-gate.mjs

      # ---- 同日再挑戦 (2周目): 不合格記事を自動修正し、審査をもう一巡 ----
      - name: 不合格記事の自動修正・再投入
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/retry-rejected.mjs

      - name: 品質ループ (再挑戦分)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/quality-loop.mjs

      - name: 画像生成・埋め込み (再挑戦分)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/embed-images.mjs

      - name: 安全ゲート (再挑戦分)
        run: node scripts/safety-gate.mjs

      # 公開確定Markdown → サイト記事HTML変換 + 一覧・カテゴリ・sitemap再生成
      - name: 記事HTMLレンダリング・一覧再生成
        working-directory: .
        run: |
          python3 -m pip install --quiet markdown
          python3 tools/render_blog.py
          python3 tools/gen_blog_pages.py

      # Cloudflare Pages へ本番デプロイ (Secrets 未設定時は安全にスキップ)
      - name: 本番デプロイ (Cloudflare Pages)
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN 未設定 → デプロイをスキップ (記事の生成・コミットまでは実施)"
          else
            python3 tools/make_dist.py
            npx --yes wrangler pages deploy dist --project-name seven-hpunyou --branch master --commit-dirty=true
          fi

      # sitemap ping + IndexNow + publish-queue → posted への移動 (デプロイ後に通知する)
      - name: 検索エンジン通知
        run: node scripts/notify-search.mjs

      # 各ディレクトリの記事件数と判定ログを出力 (失敗調査を1画面で完結させる)
      - name: パイプライン状態サマリー
        if: always()
        run: |
          for d in content/drafts content/publish-queue content/human-review content/posted; do
            echo "== $d: $(ls "$d" 2>/dev/null | grep -cv '^\.gitkeep$' || true) 件 =="
            ls "$d" 2>/dev/null | grep -v '^\.gitkeep$' || true
          done
          echo "== quality-log (末尾) =="; tail -c 3000 logs/quality-log.json 2>/dev/null || echo "(なし)"
          echo "== safety-gate-log (末尾) =="; tail -c 3000 logs/safety-gate-log.json 2>/dev/null || echo "(なし)"

      # 記事md・画像・レンダリング済みHTML・一覧・sitemapをまとめてコミット
      # ※途中のステップが失敗しても、生成済み記事とログは必ず保全する (if: always)
      - name: 生成コンテンツをコミット
        if: always()
        working-directory: .
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A blog-system/content blog-system/data blog-system/logs blog-system/public blog images sitemap.xml
          if git diff --cached --quiet; then
            echo "コミット対象の変更なし"
          else
            git commit -m "chore(blog): 自動生成コンテンツの保存 ($(date -u +%Y-%m-%d))"
            # 実行中に別のpushがあっても成果を失わないよう、rebaseして最大3回まで再試行
            for i in 1 2 3; do
              git push && break
              echo "push拒否 → rebaseして再試行 ($i/3)"
              git pull --rebase origin master
            done
          fi

      # 失敗調査用に生成物一式をアーティファクトとしても保存 (7日間)
      - name: 実行ログをアーティファクト保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-run-${{ github.run_number }}
          path: |
            blog-system/logs/
            blog-system/content/
          retention-days: 7
          if-no-files-found: ignore

      # 失敗時も必ず日次レポートを Slack へ送信する
      - name: Slack 日次レポート
        if: always()
        run: node scripts/report-slack.mjs
