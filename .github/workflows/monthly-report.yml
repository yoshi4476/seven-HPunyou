# =============================================================
# 月次コンサルレポート自動生成
# - 毎月1日 JST 9:00 (UTC 0:00) に前月分のレポートを reports/YYYY-MM.md へ生成
# - GA4接続 (任意): Secrets に GA4_PROPERTY_ID / GA4_CREDENTIALS_JSON を設定すると
#   アクセス実データ (セッション・流入チャネル・人気ページ・CVイベント) を統合
# - 手動実行 (workflow_dispatch) も可能
# =============================================================
name: 月次コンサルレポート

on:
  schedule:
    - cron: '0 0 1 * *' # 毎月1日 JST 9:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: blog-system
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
      GA4_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Node.js 20 セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: blog-system/package-lock.json

      - name: 依存関係インストール
        run: npm ci

      - name: Claude Code CLI セットアップ (サブスク認証時のみ)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            npm install -g @anthropic-ai/claude-code
          fi

      - name: レポート生成
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/monthly-report.mjs

      # クライアント提出用にブランドスタイルのPDF版も生成
      - name: PDF版を生成
        working-directory: .
        run: |
          python3 -m pip install --quiet markdown playwright
          python3 -m playwright install chromium --with-deps > /dev/null
          for f in reports/*.md; do python3 tools/report_pdf.py "$f"; done

      - name: レポートをコミット
        working-directory: .
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "docs(report): 月次コンサルレポート ($(TZ='Asia/Tokyo' date +%Y-%m))"
            for i in 1 2 3; do
              git push && break
              git pull --rebase origin master
            done
          fi
