# =============================================================
# 記事の受け入れ + 公開
#
# 役割は2つ:
#   1. 自動化管制塔 (SS-AIO-LP) が blog-system/content/posted/ へ納品した Markdown を
#      HTML化し、一覧・カテゴリ・sitemap・llms.txt を再生成してコミットする
#   2. リポジトリの内容を Cloudflare Pages へ公開する
#
# 記事の生成・品質審査・画像生成は管制塔側が担当する (このリポジトリでは行わない)。
# 手動実行 (Run workflow) でも同じ処理を実行できる。
# =============================================================
name: 記事の受け入れと公開

on:
  push:
    branches: [master]
    paths-ignore:            # 配信物に影響しない変更ではデプロイしない
      - 'blog-system/scripts/**'
      - 'blog-system/logs/**'
      - 'blog-system/data/**'
      - 'automation/**'
      - 'reports/**'
      - 'README.md'
      - '運用手順.md'
      - '.github/workflows/monthly-report.yml'
  # 取りこぼしの保険。pushをきっかけにした実行が失敗・スキップされても、
  # 2時間ごとの点検で未公開の納品記事を拾って公開する
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write            # 生成したHTMLをコミットするため

concurrency:
  group: cloudflare-deploy   # 同時デプロイによるAPIレート制限を避けるため直列化
  cancel-in-progress: false

jobs:
  deploy:
    # 自動コミットによる再帰実行だけを避ける (定期点検・手動実行は常に走らせる)
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      # 管制塔から納品された Markdown を記事HTMLへ変換し、一覧・sitemap・llms.txt を再生成
      - name: 記事HTMLの生成・一覧の再生成
        run: |
          python3 -m pip install --quiet markdown
          python3 tools/render_blog.py
          python3 tools/gen_blog_pages.py

      - name: 生成物をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A blog images sitemap.xml llms.txt
          if git diff --cached --quiet; then
            echo "生成物に変更なし"
          else
            git commit -m "chore(blog): 納品記事のHTML生成 ($(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M JST'))"
            for i in 1 2 3; do
              git push && break
              echo "push拒否 → 取り込んで再試行 ($i/3)"
              git pull --rebase -X ours origin master || git rebase --abort
            done
          fi

      - name: 配信物を生成 (内部資料を除外)
        run: python3 tools/make_dist.py

      - name: Cloudflare Pages へ公開
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN が未設定です (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          # APIのレート制限(10502)は一時的なものなので、間隔を空けて再試行する
          for i in 1 2 3; do
            npx --yes wrangler pages deploy dist --project-name seven-hpunyou --branch master --commit-dirty=true && exit 0
            echo "デプロイ失敗 → ${i}回目の再試行まで60秒待機"
            sleep 60
          done
          echo "::error::Cloudflareへの公開に3回失敗しました。APIトークンの有効性を確認してください"
          exit 1

      - name: 公開結果を確認
        run: |
          sleep 5
          for p in / /blog/ /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://lp.7senses.co.jp$p")
            echo "$p → HTTP $code"
          done
          echo "記事数: $(ls -d blog/*/ | grep -v category | wc -l) 本"
