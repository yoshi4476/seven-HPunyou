# =============================================================
# 公開（Cloudflare Pages へ配信するだけ）
#
# 記事・一覧・制度別・業種別のページ、記事途中の案内、写真は、すべて自動化管制塔
# (SS-AIO-LP の scripts/publish.py) が作って届ける。このリポジトリでは生成しない。
# 2026-10-03 まではこのリポジトリの tools/ と blog-system/ でも生成しており、
# 2つの仕組みが同じページを書き換えて食い違ったため、管制塔に一本化した。
# =============================================================
name: 記事の受け入れと公開

on:
  push:
    branches: [master]
    paths-ignore:            # 配信物に影響しない変更ではデプロイしない
      - 'automation/**'
      - 'reports/**'
      - 'README.md'
      - '運用手順.md'
      - '.github/workflows/monthly-report.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy   # 同時デプロイによるAPIレート制限を避けるため直列化
  cancel-in-progress: false

jobs:
  deploy:
    # 自動コミットによる再帰実行だけを避ける (定期点検・手動実行は常に走らせる)
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      # git の衝突マーカーが原稿・ページに残っていたら公開しない（2026-09-29 に「<<<<<<< Updated upstream」が見出しとして公開された）
      - name: 衝突マーカーの検査
        run: |
          if grep -rIl --exclude-dir=node_modules --exclude-dir=.git -e '<<<<<<< ' -e '>>>>>>> ' blog industry seido service index.html 2>/dev/null; then
            echo "::error::git の衝突マーカーが残っています（上のファイル）。解いてから公開してください"
            exit 1
          fi

      - name: 配信物を生成 (内部資料を除外)
        run: python3 tools/make_dist.py

      - name: Cloudflare Pages へ公開
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN が未設定です (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          # APIのレート制限(10502)は一時的なものなので、間隔を空けて再試行する
          for i in 1 2 3; do
            npx --yes wrangler pages deploy dist --project-name seven-hpunyou --branch master --commit-dirty=true && exit 0
            echo "デプロイ失敗 → ${i}回目の再試行まで60秒待機"
            sleep 60
          done
          echo "::error::Cloudflareへの公開に3回失敗しました。APIトークンの有効性を確認してください"
          exit 1

      - name: 公開結果を確認
        run: |
          sleep 5
          for p in / /blog/ /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://lp.7senses.co.jp$p")
            echo "$p → HTTP $code"
          done
          echo "記事数: $(ls -d blog/*/ | grep -v category | wc -l) 本"
